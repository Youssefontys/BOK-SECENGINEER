{# Decoratieve achtergrond. aria-hidden en pointer-events:none, zodat dit
   niets doet voor schermlezers en nooit een klik van het formulier afpakt. #}
<div class="scene" aria-hidden="true">
  <svg viewBox="0 0 1200 300" preserveAspectRatio="xMidYMax slice">
    <defs>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.05"/>
      </linearGradient>
    </defs>

    <!-- kabels: dashoffset wordt in CSS geanimeerd -->
    <g class="cables" fill="none" stroke="var(--accent)" stroke-opacity="0.45" stroke-width="2">
      <path d="M -20 290 C 180 250, 260 300, 430 262"/>
      <path d="M 1220 284 C 1040 240, 950 296, 770 258"/>
      <path d="M 120 300 C 240 210, 420 300, 560 244"/>
    </g>

    <!-- serverracks -->
    <g class="rack">
      <rect x="60" y="196" width="104" height="104" rx="6"/>
      <rect x="1036" y="214" width="92" height="86" rx="6"/>
      <g class="led">
        <circle cx="80" cy="212" r="3"/><circle cx="92" cy="212" r="3"/><circle cx="104" cy="212" r="3"/>
        <circle cx="1056" cy="230" r="3"/><circle cx="1068" cy="230" r="3"/>
      </g>
      <g stroke="var(--accent)" stroke-opacity="0.25" stroke-width="1">
        <path d="M66 234 H158 M66 252 H158 M66 270 H158"/>
        <path d="M1042 250 H1122 M1042 268 H1122"/>
      </g>
    </g>

    <!-- monitor waar de figuur achter zit -->
    <g class="monitor">
      <rect x="470" y="206" width="150" height="94" rx="5"/>
      <rect x="478" y="214" width="134" height="78" fill="url(#screen)"/>
      <g class="codelines">
        <rect x="486" y="224" width="58" height="4"/>
        <rect x="486" y="236" width="86" height="4"/>
        <rect x="486" y="248" width="40" height="4"/>
        <rect x="486" y="260" width="72" height="4"/>
        <rect x="486" y="272" width="52" height="4"/>
      </g>
    </g>

    <!-- de figuur met capuchon -->
    <g class="hacker">
      <path class="shoulders" d="M608 300 C 618 254, 652 232, 700 230 C 748 232, 782 254, 792 300 Z"/>
      <ellipse class="hood" cx="700" cy="198" rx="56" ry="62"/>
      <ellipse class="face" cx="700" cy="208" rx="37" ry="45"/>
      <path class="brim" d="M 648 196 C 660 152, 740 152, 752 196 C 736 170, 664 170, 648 196 Z"/>
      {# De gaze-groep schuift mee met de muis (CSS gebruikt --mx/--my die
         cyber.js vult), de eyes-groep eronder doet alleen de kleur en de
         gloed. Zo bijten de twee transformaties elkaar niet. #}
      <g class="gaze">
        <g class="eyes" filter="url(#glow)">
          <ellipse cx="685" cy="206" rx="7" ry="4"/>
          <ellipse cx="715" cy="206" rx="7" ry="4"/>
        </g>
      </g>
      <!-- handen op het toetsenbord -->
      <rect class="keyboard" x="636" y="286" width="128" height="14" rx="4"/>
    </g>
  </svg>

  <p class="ticker"><span class="prompt">&gt;</span> <span data-ticker>verbinding beveiligd ~ wachten op invoer</span></p>
</div>
