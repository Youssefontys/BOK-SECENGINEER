<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Registreren</title></head>
<body>
  <h1>Registreren</h1>
  {% if error %}<p style="color:#b00">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Gebruikersnaam <input name="username" autocomplete="username" required></label><br>
    <label>Wachtwoord <input name="password" type="password" autocomplete="new-password" required></label><br>
    <button type="submit">Account aanmaken</button>
  </form>
  <p><a href="{{ url_for('login') }}">Al een account? Inloggen</a></p>
</body>
</html>
