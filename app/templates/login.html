<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><title>Inloggen</title></head>
<body>
  <h1>Inloggen</h1>
  {% if error %}<p style="color:#b00">{{ error }}</p>{% endif %}
  <form method="post">
    <label>Gebruikersnaam <input name="username" autocomplete="username" required></label><br>
    <label>Wachtwoord <input name="password" type="password" autocomplete="current-password" required></label><br>
    <button type="submit">Volgende</button>
  </form>
  <p><a href="{{ url_for('register') }}">Nog geen account? Registreren</a></p>
</body>
</html>
