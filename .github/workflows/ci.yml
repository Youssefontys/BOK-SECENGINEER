name: CI

# Bewust nog kaal: bouwen, testen, en controleren dat de app opstart.
# Securityscans (IaC, SAST, dependencies, image, SBoM) komen hierna als
# aparte stappen erbij, zodat per toevoeging te zien is wat hij oplevert.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Wegwerpwaarden voor de testomgeving
        # Dezelfde variabelen als lokaal, maar per run opnieuw gegenereerd.
        # Er staat dus geen enkel wachtwoord in de repo of in GitHub Secrets
        # voor deze stap; hij praat alleen met containers op de runner zelf.
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "APP_DB_PASSWORD=$(openssl rand -hex 16)"
            echo "FLASK_SECRET_KEY=$(openssl rand -hex 32)"
            echo "DB_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          } > .env

      - name: Compose-configuratie controleren
        run: docker compose config --quiet

      - name: Image bouwen en stack starten
        run: docker compose up -d --build

      - name: Wachten tot de app antwoordt
        run: |
          for poging in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/login > /dev/null; then
              echo "App antwoordt na poging $poging."
              exit 0
            fi
            sleep 2
          done
          echo "App antwoordde niet binnen 60 seconden."
          exit 1

      - name: Tests voorbereiden
        run: |
          docker compose exec -T app pip install --user --no-cache-dir -r requirements-dev.txt
          docker compose cp scripts/vault_init.py app:/tmp/vault_init.py

      - name: Tests draaien
        run: docker compose exec -T app python -m pytest tests -v

      - name: Vault-sleutels na herstart controleren
        run: |
          docker compose exec -T app python tests/vault_restart_probe.py save
          docker compose restart vault
          for poging in $(seq 1 30); do
            if docker compose exec -T app python tests/vault_restart_probe.py check; then
              echo "Bestaande ciphertext blijft leesbaar na Vault-herstart."
              exit 0
            fi
            sleep 2
          done
          echo "Vault-herstartcontrole mislukt."
          exit 1

      - name: Image starten zoals in productie
        # De stappen hierboven draaien met de dev-server en de bronmap als
        # bind-mount, dus ze testen de bronbestanden en niet de image. Hier
        # start dezelfde app zonder die twee overrides: gunicorn uit de
        # Dockerfile, met alleen de code die in de image zit.
        run: |
          docker compose -f compose.yaml -f compose.image-smoke.yaml up -d --force-recreate app
          for poging in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/login > /dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/login > /dev/null
          docker compose exec -T app sh -c 'tr "\0" " " < /proc/1/cmdline' | grep -q gunicorn
          # Alleen het tokenvolume mag erin gemount zijn, geen bronmap.
          mounts=$(docker inspect "$(docker compose ps -q app)" --format '{{range .Mounts}}{{.Destination}} {{end}}')
          echo "Mounts: $mounts"
          [ "$mounts" = "/run/vault " ]

      - name: Logs tonen bij een mislukte run
        if: failure()
        run: docker compose logs

      - name: Opruimen
        if: always()
        run: docker compose down -v
